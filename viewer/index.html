<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Orchestration Report Viewer</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; }
    .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    .toolbar input[type="file"], .toolbar select, .toolbar input[type="text"] { padding: 6px 8px; }
    .table-wrap { overflow: auto; max-height: 60vh; border: 1px solid #ccc; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #f5f5f5; position: sticky; top: 0; }
    tr:hover { background: #f9f9f9; }
    tr.selected { background: #e3f2fd; }
    .detail { margin-top: 12px; padding: 12px; border: 1px solid #ccc; background: #fafafa; }
    .detail h3 { margin-top: 0; }
    .detail dl { margin: 0; }
    .detail dt { font-weight: bold; margin-top: 8px; }
    .detail dd { margin-left: 0; }
  </style>
</head>
<body>
  <h1>Orchestration Report</h1>
  <div class="toolbar">
    <input type="file" id="file" accept=".json" />
    <label>Search: <input type="text" id="search" placeholder="Filter…" /></label>
    <label>Kind: <select id="kind"><option value="">All</option></select></label>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Kind</th><th>When</th><th>Details</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="detail" id="detail" style="display:none;">
    <h3>Detail</h3>
    <dl>
      <dt>Kind</dt><dd id="d-kind"></dd>
      <dt>When</dt><dd id="d-when"></dd>
      <dt>Details</dt><dd id="d-details"></dd>
    </dl>
  </div>

  <script>
    let data = null;
    let findings = [];

    function render() {
      const search = (document.getElementById('search').value || '').toLowerCase();
      const kindFilter = (document.getElementById('kind').value || '').toLowerCase();
      const filtered = findings.filter(function (f) {
        const matchSearch = !search || [f.kind, f.when, f.details].some(function (s) { return (s || '').toLowerCase().indexOf(search) >= 0; });
        const matchKind = !kindFilter || (f.kind || '').toLowerCase() === kindFilter;
        return matchSearch && matchKind;
      });

      const tbody = document.getElementById('tbody');
      tbody.innerHTML = '';
      filtered.forEach(function (f, i) {
        const tr = document.createElement('tr');
        tr.innerHTML = '<td>' + (f.kind || '') + '</td><td>' + (f.when || '') + '</td><td>' + (f.details || '') + '</td>';
        tr.dataset.index = String(i);
        tr.addEventListener('click', function () {
          document.querySelectorAll('#tbody tr.selected').forEach(function (r) { r.classList.remove('selected'); });
          tr.classList.add('selected');
          document.getElementById('detail').style.display = 'block';
          document.getElementById('d-kind').textContent = f.kind || '';
          document.getElementById('d-when').textContent = f.when || '';
          document.getElementById('d-details').textContent = f.details || '';
        });
        tbody.appendChild(tr);
      });
    }

    function setFindings(list) {
      findings = list;
      const kindSel = document.getElementById('kind');
      const kinds = [];
      findings.forEach(function (f) { if (f.kind && kinds.indexOf(f.kind) < 0) kinds.push(f.kind); });
      kinds.sort();
      kindSel.innerHTML = '<option value="">All</option>' + kinds.map(function (k) { return '<option value="' + k.toLowerCase() + '">' + k + '</option>'; }).join('');
      render();
    }

    function load(data) {
      const findings = data.findings || data.issues || [];
      setFindings(findings);
    }

    document.getElementById('file').addEventListener('change', function (e) {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = function () { try { load(JSON.parse(r.result)); } catch (err) { alert('Invalid JSON'); } };
      r.readAsText(f);
    });

    document.getElementById('search').addEventListener('input', render);
    document.getElementById('kind').addEventListener('change', render);

    fetch('../runs/report.json').then(function (res) { return res.ok ? res.json() : Promise.reject(); }).then(load).catch(function () {});
  </script>
</body>
</html>
